name: relayon

# ═══════════════════════════════════════════════════════════════
# v3.2 — Verified for Oracle Cloud ARM64 (Ampere A1)
# ═══════════════════════════════════════════════════════════════

x-common-env: &common-env
  NODE_ENV: production
  DATABASE_URL: postgresql://relayon:${POSTGRES_PASSWORD}@postgres:5432/relayon?sslmode=disable
  DIRECT_DATABASE_URL: postgresql://relayon:${POSTGRES_PASSWORD}@postgres:5432/relayon?sslmode=disable
  UPSTASH_REDIS_TCP_URL: redis://redis:6379
  MONGODB_URI: mongodb://mongo:27017
  MONGODB_DB_NAME: relayon
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  CRON_SECRET: ${CRON_SECRET}
  CONNECTOR_ENCRYPTION_KEYS: ${CONNECTOR_ENCRYPTION_KEYS}
  IP_HASH_SALT: ${IP_HASH_SALT}
  API_KEY_PEPPER: ${API_KEY_PEPPER}
  GROQ_API_KEY: ${GROQ_API_KEY}
  GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
  GROQ_TIMEOUT_MS: "6000"
  INGRESS_URL: http://ingress:3002
  API_URL: http://api:3001
  WORKERS_URL: http://workers:3003
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
  PUBLIC_INGRESS_URL: ${PUBLIC_INGRESS_URL:-http://localhost/webhook}
  PUBLIC_TUNNEL_URL: ${PUBLIC_TUNNEL_URL:-http://localhost}
  CORS_ORIGIN: ${APP_ORIGIN:-http://localhost}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-Relayon <noreply@relayon.local>}
  GMAIL_USER: ${GMAIL_USER:-}
  GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}

x-platform: &arm-platform
  platform: linux/arm64   # ⚠️ Oracle Cloud Ampere = ARM64. Comment out for x86_64.

services:
  # ═══════════════════════════════════════════════════════════
  # Infrastructure
  # ═══════════════════════════════════════════════════════════

  postgres:
    <<: *arm-platform
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relayon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: relayon
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayon -d relayon"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [relayon-net]

  redis:
    <<: *arm-platform
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [relayon-net]

  mongo:
    <<: *arm-platform
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [relayon-net]

  # ═══════════════════════════════════════════════════════════
  # One-shot migration (runs once, exits)
  # ═══════════════════════════════════════════════════════════
  migrate:
    <<: *arm-platform
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: migration     # Uses migration stage from Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
    environment: *common-env
    command: >
      sh -c "npx prisma migrate deploy --schema packages/db/prisma/schema.prisma &&
             echo '✅ Migrations applied'"
    restart: "no"
    networks: [relayon-net]

  # ═══════════════════════════════════════════════════════════
  # Application
  # ═══════════════════════════════════════════════════════════

  api:
    <<: *arm-platform
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: production
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment: *common-env
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 10
    networks: [relayon-net]

  ingress:
    <<: *arm-platform
    build:
      context: .
      dockerfile: docker/Dockerfile.ingress
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment: *common-env
    expose: ["3002"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks: [relayon-net]

  workers:
    <<: *arm-platform
    build:
      context: .
      dockerfile: docker/Dockerfile.workers
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment: *common-env
    expose: ["3003"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/internal/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 10
    networks: [relayon-net]

  dashboard:
    <<: *arm-platform
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
      args:
        API_URL: ${PUBLIC_API_URL:-http://localhost/api}
        INGRESS_URL: ${PUBLIC_INGRESS_URL:-http://localhost}
    restart: unless-stopped
    networks: [relayon-net]

  nginx:
    <<: *arm-platform
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
      ingress: { condition: service_healthy }
      dashboard: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [relayon-net]

  # ═══════════════════════════════════════════════════════════
  # Cron sidecar — replaces cron-job.org when self-hosting
  # ═══════════════════════════════════════════════════════════
  cron:
    <<: *arm-platform
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
      workers: { condition: service_healthy }
    environment:
      CRON_SECRET: ${CRON_SECRET}
      API_URL: http://api:3001
      WORKERS_URL: http://workers:3003
    entrypoint: >
      sh -c "apk add --no-cache curl >/dev/null 2>&1 &&
             echo '⏰ Cron sidecar started' &&
             while true; do
               curl -fsS --max-time 60 -X POST -H \"X-Cron-Secret: $$CRON_SECRET\" $$WORKERS_URL/internal/process >/dev/null 2>&1 || true;
               curl -fsS --max-time 60 -X POST -H \"X-Cron-Secret: $$CRON_SECRET\" $$WORKERS_URL/internal/deliver >/dev/null 2>&1 || true;
               curl -fsS --max-time 60 -X POST -H \"X-Cron-Secret: $$CRON_SECRET\" $$WORKERS_URL/internal/schedule/tick >/dev/null 2>&1 || true;
               curl -fsS --max-time 60 -X POST -H \"X-Cron-Secret: $$CRON_SECRET\" $$API_URL/api/cron/outbox/tick >/dev/null 2>&1 || true;
               sleep 60;
             done"
    networks: [relayon-net]

volumes:
  pg_data:
  redis_data:
  mongo_data:

networks:
  relayon-net:
    driver: bridge