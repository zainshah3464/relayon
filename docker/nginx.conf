upstream api_upstream {
  server api:3001;
  keepalive 32;
}

upstream ingress_upstream {
  server ingress:3002;
  keepalive 32;
}

upstream dashboard_upstream {
  server dashboard:80;
  keepalive 16;
}

# Rate limit zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=600r/m;

server {
  listen 80;
  server_name _;
  client_max_body_size 6m;

  # Security headers
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # ═══ API ═══
  location /api/ {
    limit_req zone=api_limit burst=30 nodelay;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # SSE support (AI chat, playground, tunnel)
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ═══ Webhooks ═══
  location /webhook/ {
    limit_req zone=webhook_limit burst=100 nodelay;
    proxy_pass http://ingress_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # ═══ Playground + Tunnel capture ═══
  location ~ ^/(play|t)/ {
    proxy_pass http://ingress_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  # ═══ Health check ═══
  location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # ═══ Dashboard (catch-all — must be LAST) ═══
  location / {
    proxy_pass http://dashboard_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}