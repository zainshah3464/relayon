<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" role="img" aria-label="Relayon">
  <title>Relayon</title>
  <defs>
    <!-- Richer 3-stop gradient -->
    <linearGradient id="relayon-brand" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="0.35" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <!-- Inner shadow at top for depth -->
    <linearGradient id="relayon-depth" x1="16" y1="0" x2="16" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <!-- Subtle rim highlight -->
    <linearGradient id="relayon-rim" x1="16" y1="0" x2="16" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="32" height="32" rx="6.4" fill="url(#relayon-brand)"/>
  <rect width="32" height="32" rx="6.4" fill="url(#relayon-depth)"/>

  <!-- Refined geometric R (hollow bowl via evenodd) -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="
    M 10 8
    L 10 24
    L 13 24
    L 13 17
    L 19 17
    L 22.5 24
    L 25.5 24
    L 20 15.8
    C 21.5 15.5 23 14 23 12
    C 23 9 20.5 8 18 8
    L 13 8
    Z
    M 13 11
    L 18 11
    C 19 11 20 11.5 20 12.5
    C 20 13.5 19 14 18 14
    L 13 14
    Z
  "/>

  <!-- Rim highlight (top edge only) -->
  <rect width="32" height="6" rx="6.4" fill="url(#relayon-rim)"/>
</svg>