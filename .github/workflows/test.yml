name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: relayon_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval=10s
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/relayon_ci?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379
      TEST_MONGODB_URI: mongodb://localhost:27017/relayon_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
      - run: npm run db:rls
      - run: npm run test:coverage
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: relayon_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=5s
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval=10s
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/relayon_ci?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379
      TEST_MONGODB_URI: mongodb://localhost:27017/relayon_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
      - run: npm run db:rls
      - run: npm run test:integration